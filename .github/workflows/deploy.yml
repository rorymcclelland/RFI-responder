# Sprint 20 (S20-3, S20-4): deploys, checks the deploy, and runs the acceptance tests on staging.
#
# - A push to a sprint-* branch deploys its migrations and Edge Functions to the staging project, waits
#   for Vercel's preview of the same commit (which talks to staging), checks the deploy, then runs the
#   browser acceptance tests there with test users made for the run, keeping the recordings.
# - A push to main deploys to the live demo, but only after Rory approves it: the job uses the GitHub
#   environment "production", which he sets to require his review (Q1 of the Sprint 20 refinement).
#
# Set up once by the repository owner (docs/DEPLOYING.md, "Staging and automated deploys"). Until the
# settings exist each job says so and passes, so nothing is deployed by accident.
# Runs only on pushes to this repository: forks and pull requests get no secrets and no environment.
name: Deploy

on:
  push:
    branches: ['sprint-*', 'main']
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    name: Staging, its checks and the acceptance tests
    if: startsWith(github.ref_name, 'sprint-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    # Write access only to push the results to their own branch, for the demo page.
    permissions:
      contents: write
      deployments: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_REF: ${{ vars.STAGING_PROJECT_REF }}
      PRODUCTION_SUPABASE_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
      PRODUCTION_APP_HOST: ${{ vars.PRODUCTION_APP_HOST }}
    steps:
      - name: Is staging set up?
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$STAGING_REF" ] || [ -z "$PRODUCTION_SUPABASE_REF" ] || [ -z "$PRODUCTION_APP_HOST" ]; then
            echo "::notice::Staging is not set up yet (docs/DEPLOYING.md, Staging and automated deploys); nothing deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$STAGING_REF" = "$PRODUCTION_SUPABASE_REF" ]; then
            echo "::error::STAGING_PROJECT_REF is the live demo's project"; exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm install -g npm@11 && npm ci
      - if: steps.ready.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Migrations to staging
        if: steps.ready.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$STAGING_REF"
          supabase db push --yes
      - name: Edge Functions to staging
        if: steps.ready.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$STAGING_REF"
      - name: Wait for Vercel's preview of this commit
        if: steps.ready.outputs.ok == 'true'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            url=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&per_page=20" --jq '.[] | select(.environment | test("^Preview")) | .statuses_url' | head -1)
            if [ -n "$url" ]; then
              state=$(gh api "$url" --jq '.[0].state // ""')
              env_url=$(gh api "$url" --jq '.[0].environment_url // ""')
              if [ "$state" = "success" ] && [ -n "$env_url" ]; then echo "url=$env_url" >> "$GITHUB_OUTPUT"; echo "Preview: $env_url"; exit 0; fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then echo "::error::Vercel's preview build failed"; exit 1; fi
            fi
            sleep 15
          done
          echo "::error::No Vercel preview for this commit after 15 minutes"; exit 1
      - name: Check the deploy
        if: steps.ready.outputs.ok == 'true'
        env:
          SUPABASE_URL: https://${{ vars.STAGING_PROJECT_REF }}.supabase.co
          APP_URL: ${{ steps.preview.outputs.url }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          supabase migration list --linked > /tmp/migrations.txt
          npx tsx scripts/deploy-check.ts /tmp/migrations.txt
      - name: Test people for this run, and a demo reset
        if: steps.ready.outputs.ok == 'true'
        env:
          STAGING_SUPABASE_URL: https://${{ vars.STAGING_PROJECT_REF }}.supabase.co
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/e2e-staging-users.ts
      - name: Install the test browser
        if: steps.ready.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests on staging
        if: steps.ready.outputs.ok == 'true'
        env:
          E2E_TARGET: staging
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_FORBIDDEN_HOSTS: ${{ vars.PRODUCTION_APP_HOST }},${{ vars.PRODUCTION_PROJECT_REF }}.supabase.co
          E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: npm run test:e2e
      - name: Publish the results for the demo page
        if: always() && steps.ready.outputs.ok == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: bash scripts/publish-e2e-results.sh staging
      - name: Keep the report and recordings
        if: always() && steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging
          retention-days: 14
          path: e2e-results/

  production:
    name: The live demo (after Rory's approval)
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PRODUCTION_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
      PRODUCTION_APP_HOST: ${{ vars.PRODUCTION_APP_HOST }}
    steps:
      - name: Is the deploy set up?
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PRODUCTION_REF" ] || [ -z "$PRODUCTION_APP_HOST" ]; then
            echo "::notice::The production deploy is not set up yet (docs/DEPLOYING.md); deploy by hand as before."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm install -g npm@11 && npm ci
      - if: steps.ready.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Migrations to the live demo
        if: steps.ready.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PRODUCTION_REF"
          supabase db push --yes
      - name: Edge Functions to the live demo
        if: steps.ready.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$PRODUCTION_REF"
      - name: Check the deploy
        if: steps.ready.outputs.ok == 'true'
        env:
          SUPABASE_URL: https://${{ vars.PRODUCTION_PROJECT_REF }}.supabase.co
          APP_URL: https://${{ vars.PRODUCTION_APP_HOST }}
        run: |
          supabase migration list --linked > /tmp/migrations.txt
          npx tsx scripts/deploy-check.ts /tmp/migrations.txt
