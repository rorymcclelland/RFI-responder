# THROWAWAY, branch sprint-26-f73 only, never merged (Sprint 26, S26-1 case 5, F-73: measured again after the fix).
# Replaces this branch's Deploy with one job: time marking a large response as sent, and bulk approval,
# on the hosted staging database, with synthetic data loaded and timed inside a transaction that is
# rolled back (scripts/spikes/f73-hosted.sql), so staging keeps nothing. No migration, no function,
# no app build, no browser test, no AI. The branch is Rory's to delete.
name: Deploy

on:
  push:
    branches: ['sprint-26-f73']

permissions:
  contents: read

jobs:
  staging:
    name: F-73 spike on staging (rolled back)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      STAGING_REF: ${{ vars.STAGING_PROJECT_REF }}
      PRODUCTION_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Time sending and bulk approval on staging
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$STAGING_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::No staging ref"; exit 1; }
          [ "$STAGING_REF" != "$PRODUCTION_REF" ] || { echo "::error::The staging ref names the live demo"; exit 1; }
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          password=$(node -e 'process.stdout.write(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD ?? ""))')
          db_url=""
          for cluster in aws-0 aws-1; do
            candidate="postgresql://postgres.${STAGING_REF}:${password}@${cluster}-eu-west-2.pooler.supabase.com:5432/postgres"
            if psql "$candidate" -tAc 'select 1' >/dev/null 2>&1; then db_url="$candidate"; break; fi
          done
          [ -n "$db_url" ] || { echo "::error::Could not reach staging's database"; exit 1; }
          echo "::add-mask::$db_url"
          for size in "1 500" "4 500" "2 2000" "3 2000"; do
            set -- $size
            for run in 1 2; do
              psql "$db_url" -q -v files="$1" -v per="$2" -f scripts/spikes/f73-hosted.sql | grep '^F73' | sed "s/^/run ${run}: /"
            done
          done
