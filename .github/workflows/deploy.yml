# THROWAWAY, branch sprint-26-f77 only, never merged (Sprint 26, S26-2 case 1, F-77).
# Tries to move live with the workflow's own token, which the ruleset on live must refuse. The commit
# pushed is live's own plus this file, so the app is unchanged even if the push got through.
name: Deploy
on:
  push:
    branches: ['sprint-26-f77']
permissions:
  contents: write
jobs:
  try:
    name: A sprint workflow tries to move live (must be refused)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Push HEAD to live with the workflow's own token
        env:
          TOKEN: ${{ github.token }}
        run: |
          before=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/live | cut -f1)
          if git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/live" 2>&1 | tee /tmp/push.txt; then :; fi
          after=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/live | cut -f1)
          echo "live before: $before"; echo "live after:  $after"
          grep -E "GH013|rule violations|refusing|denied" /tmp/push.txt && [ "$before" = "$after" ] && echo "REFUSED, live unchanged" || { echo "::error::live moved or the push was not refused"; exit 1; }
