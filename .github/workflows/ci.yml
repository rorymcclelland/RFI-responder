name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, unit tests, audit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10 hits a resolver bug with this dependency tree (see decision 0002).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm run coverage
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: No provider details in the browser bundle (S1-2, project rule 3)
        run: |
          # Provider details, or an actual secret: a JWT whose payload says service_role (base64
          # "c2VydmljZV9yb2xl") or a new-style secret key. The config guard's own wording is allowed.
          if grep -rlE 'voyageai|VOYAGE_API_KEY|:11434|anthropic\.com|c2VydmljZV9yb2xl|sb_secret_[A-Za-z0-9_-]{8,}' dist; then
            echo "::error::The browser bundle contains an embedding or model provider detail, or a secret key"; exit 1
          fi

  database:
    name: Database tests (Postgres + Supabase shim)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run test:db

  supabase:
    name: Migrations and auth settings on the real Supabase stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Edge Functions (Deno)
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - name: Start Supabase (database, auth and API only)
        run: supabase start -x studio,imgproxy,inbucket,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - name: Apply every migration and the dev seed from scratch
        run: supabase db reset
      - name: Sign-up is refused (invite-only, decision 0003)
        run: |
          eval "$(supabase status -o env)"
          code=$(curl -s -o /tmp/signup.json -w '%{http_code}' -X POST "$API_URL/auth/v1/signup" \
            -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"email":"intruder@example.com","password":"Intruder2026pw"}')
          cat /tmp/signup.json; echo
          if [ "$code" -lt 400 ]; then echo "::error title=Sign-up was allowed (HTTP $code)::$(head -c 500 /tmp/signup.json)"; exit 1; fi
      - name: Seeded admin can sign in
        run: |
          eval "$(supabase status -o env)"
          code=$(curl -s -o /tmp/signin.json -w '%{http_code}' -X POST "$API_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"email":"sarah.chen@example.com","password":"LocalDev2026pw"}')
          test "$code" = "200" || { echo "::error title=Seeded sign-in failed (HTTP $code)::$(head -c 500 /tmp/signin.json)"; exit 1; }
      - name: Edge Functions refuse unsigned calls, enforce limits, and fail safely
        run: |
          eval "$(supabase status -o env)"
          # A provider that cannot be reached, and a fake key that must never be echoed.
          printf 'EMBEDDING_PROVIDER=ollama\nEMBEDDING_MODEL=bge-m3\nOLLAMA_URL=http://127.0.0.1:9\nVOYAGE_API_KEY=sk-should-never-appear\nANTHROPIC_API_KEY=sk-ant-should-never-appear\n' > /tmp/fn.env
          supabase functions serve --env-file /tmp/fn.env > /tmp/functions.log 2>&1 &
          sleep 15
          F="$API_URL/functions/v1"
          fail() { echo "::error title=$1::$2"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$F/embed" -H 'Content-Type: application/json' -d '{"texts":["a"],"kind":"query"}')
          [ "$code" = "401" ] || fail "No JWT should get 401" "got $code"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/embed" -H "Authorization: Bearer $ANON_KEY" -H 'Content-Type: application/json' -d '{"texts":["a"],"kind":"query"}')
          [ "$code" = "401" ] || fail "Anon key alone should get 401" "got $code $(cat /tmp/r.json)"
          TOKEN=$(curl -s -X POST "$API_URL/auth/v1/token?grant_type=password" -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"email":"sarah.chen@example.com","password":"LocalDev2026pw"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          big=$(python3 -c 'import json; print(json.dumps({"texts":["a"]*129,"kind":"query"}))')
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/embed" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$big")
          [ "$code" = "400" ] || fail "129 texts should get 400" "got $code $(cat /tmp/r.json)"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/embed" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"texts":["Do you use MFA?"],"kind":"query"}')
          [ "$code" = "503" ] || fail "Unreachable provider should get 503" "got $code $(cat /tmp/r.json)"
          code=$(curl -s -o /tmp/r2.json -w '%{http_code}' -X POST "$F/embed-entries" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "503" ] || fail "embed-entries with unreachable provider should get 503" "got $code $(cat /tmp/r2.json)"
          if grep -q 'sk-should-never-appear' /tmp/r.json /tmp/r2.json; then fail "Key leaked" "a response contained the provider key"; fi
          echo "embed: $(cat /tmp/r.json)"; echo "embed-entries: $(cat /tmp/r2.json)"
          # invite-user (Sprint 15, S15-5): signed in, admins only, the address checked before anything is sent.
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/invite-user" -H "Authorization: Bearer $ANON_KEY" -H 'Content-Type: application/json' -d '{"email":"new@example.com"}')
          [ "$code" = "401" ] || fail "invite-user with the anon key alone should get 401" "got $code $(cat /tmp/r.json)"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/invite-user" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"email":"not an address"}')
          [ "$code" = "400" ] || fail "invite-user with a malformed address should get 400" "got $code $(cat /tmp/r.json)"
          MEMBER=$(curl -s -X POST "$API_URL/auth/v1/token?grant_type=password" -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"email":"james.okafor@example.com","password":"LocalDev2026pw"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/invite-user" -H "Authorization: Bearer $MEMBER" -H 'Content-Type: application/json' -d '{"email":"new@example.com"}')
          [ "$code" = "403" ] || fail "invite-user by a member should get 403" "got $code $(cat /tmp/r.json)"
          # Security review, finding 2: an address with an account is refused before anything is sent, and reserved domains are refused.
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/invite-user" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"email":"James.Okafor@example.com"}')
          [ "$code" = "409" ] || fail "invite-user for an existing account should get 409" "got $code $(cat /tmp/r.json)"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/invite-user" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"email":"sarah.chen@example.invalid"}')
          [ "$code" = "400" ] || fail "invite-user for a fictional .invalid address should get 400" "got $code $(cat /tmp/r.json)"
          # The policy helpers are not API endpoints (Sprint 15, S15-3, test 4).
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$API_URL/rest/v1/rpc/is_admin" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "404" ] || fail "is_admin should not be callable through the API" "got $code $(cat /tmp/r.json)"
          # ask-knowledge (Sprint 18, S18-4): refusals, then a real question with every provider failing.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$F/ask-knowledge" -H 'Content-Type: application/json' -d '{"question":"How do you encrypt data at rest?"}')
          [ "$code" = "401" ] || fail "ask-knowledge without JWT should get 401" "got $code"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/ask-knowledge" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"question":"   "}')
          [ "$code" = "400" ] || fail "ask-knowledge with an empty question should get 400" "got $code $(cat /tmp/r.json)"
          count_questions() { curl -s "$API_URL/rest/v1/rfi_questions?select=id" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))'; }
          count_ask_usage() { curl -s "$API_URL/rest/v1/ai_usage?select=id&function=eq.ask-knowledge" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))'; }
          q_before=$(count_questions)
          code=$(curl -s -o /tmp/a.json -w '%{http_code}' -X POST "$F/ask-knowledge" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"question":"How do you encrypt data at rest?"}')
          [ "$code" = "200" ] || fail "ask-knowledge should answer with failing providers" "got $code $(cat /tmp/a.json)"
          echo "ask-knowledge: $(cat /tmp/a.json)"
          if grep -q 'should-never-appear' /tmp/a.json; then fail "Key leaked" "ask-knowledge returned a key"; fi
          code=$(curl -s -o /tmp/a2.json -w '%{http_code}' -X POST "$F/ask-knowledge" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"question":"What is the annual licence cost?"}')
          python3 - <<'PY' || fail "ask-knowledge did not answer from the seed entries, or did not hold pricing" "$(cat /tmp/a.json) $(cat /tmp/a2.json)"
          import json, re
          a = json.load(open('/tmp/a.json'))['result']
          assert a['sources'] and all(re.fullmatch(r'KB-\d{4,}', s['ref']) for s in a['sources']), a
          # The drafter fails (a fake key), so the draft is assembled from the matched seed entries.
          assert a['draftKind'] == 'assembled' and a['draft'].strip(), a
          p = json.load(open('/tmp/a2.json'))['result']
          assert p['gate'] == 'pricing' and p['draftKind'] == 'person_required', p
          PY
          # Nothing about the question is saved (S18-4 test 1); the failed provider calls are recorded (test 5).
          [ "$(count_questions)" = "$q_before" ] || fail "ask-knowledge must not write questions" "$q_before before, $(count_questions) after"
          n=$(count_ask_usage)
          [ "$n" -ge 1 ] || fail "ask-knowledge should record its provider calls in ai_usage" "got $n rows"
          # At the daily cap it refuses with the limit's message and spends nothing (test 3).
          S="$API_URL/rest/v1/ai_settings?id=eq.true"
          cap=$(curl -s "$S&select=daily_question_cap" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["daily_question_cap"])')
          curl -s -o /dev/null -X PATCH "$S" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"daily_question_cap":0}'
          code=$(curl -s -o /tmp/a3.json -w '%{http_code}' -X POST "$F/ask-knowledge" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"question":"How do you encrypt data at rest?"}')
          curl -s -o /dev/null -X PATCH "$S" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "{\"daily_question_cap\":$cap}"
          [ "$code" = "429" ] || fail "ask-knowledge at the daily cap should get 429" "got $code $(cat /tmp/a3.json)"
          grep -q "limit on processing questions" /tmp/a3.json || fail "ask-knowledge at the cap should say so" "$(cat /tmp/a3.json)"
          [ "$(count_ask_usage)" = "$n" ] || fail "ask-knowledge at the cap must spend nothing" "$n before, $(count_ask_usage) after"
          # process-questions (Sprint 2, S2-2a): refusals, then a real batch with every provider failing.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$F/process-questions" -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "401" ] || fail "process-questions without JWT should get 401" "got $code"
          eleven=$(python3 -c 'import json,uuid; print(json.dumps({"sessionId":str(uuid.uuid4()),"questionIds":[str(uuid.uuid4()) for _ in range(11)]}))')
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$F/process-questions" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$eleven")
          [ "$code" = "400" ] || fail "11 questions should get 400" "got $code $(cat /tmp/r.json)"
          R="$API_URL/rest/v1"
          H=(-H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -H 'Prefer: return=representation')
          SID=$(curl -s -X POST "$R/rfi_sessions" "${H[@]}" -d '{"file_name":"ci.csv","question_count":2}' | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])')
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$R/rfi_questions" "${H[@]}" -d "{\"session_id\":\"$SID\",\"position\":0,\"question\":\"Q\",\"confidence\":1}")
          [ "$code" -ge 400 ] || fail "A member must not be able to set confidence" "got $code $(cat /tmp/r.json)"
          QS=$(curl -s -X POST "$R/rfi_questions" "${H[@]}" -d "[{\"session_id\":\"$SID\",\"position\":0,\"question\":\"What is the annual licence cost?\"},{\"session_id\":\"$SID\",\"position\":1,\"question\":\"How do you encrypt data at rest?\"}]")
          IDS=$(echo "$QS" | python3 -c 'import sys,json; print(json.dumps([q["id"] for q in json.load(sys.stdin)]))')
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -X POST "$F/process-questions" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "{\"sessionId\":\"$SID\",\"questionIds\":$IDS}")
          [ "$code" = "200" ] || fail "process-questions should succeed with failing providers" "got $code $(cat /tmp/p.json)"
          echo "process-questions: $(cat /tmp/p.json)"
          if grep -q 'should-never-appear' /tmp/p.json; then fail "Key leaked" "process-questions returned a key"; fi
          python3 - <<'PY' || fail "process-questions did not fail safe" "$(cat /tmp/p.json)"
          import json
          p = {x['draftKind'] + ':' + str(x['gate']) for x in json.load(open('/tmp/p.json'))['processed']}
          # Pricing caught by the rules alone; the other question unchecked (classifier down), drafted by assembly, no confidence.
          assert 'person_required:pricing' in p, p
          assert any(v.endswith(':unchecked') for v in p), p
          PY
          code=$(curl -s -o /tmp/b.json -w '%{http_code}' -X POST "$R/rpc/bulk_accept" "${H[@]}" -d "{\"p_session\":\"$SID\",\"p_min_confidence\":0}")
          echo "bulk_accept: $code $(cat /tmp/b.json)"
